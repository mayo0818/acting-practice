<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="맞춤법">
<title>맞춤법 10문항</title>
<style>
:root{
  --fg:#17181a;
  --body:#33363b;
  --muted:#6f757d;
  --line:#e6e7ea;
  --soft:#f6f7f8;
  --accent:#2c5f8a;
  --ok:#18794e;
  --ok-bg:#f1f8f4;
  --no:#b23c2f;
  --no-bg:#fdf3f1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#fff;color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:520px;margin:0 auto;height:52px;padding:0 12px 0 16px;display:flex;align-items:center;gap:8px}
.top-t{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--body);border-radius:8px}
.ic:active{background:var(--soft)}
.ic.txt{width:auto;padding:0 10px;font-size:14px;color:var(--muted);font-weight:500}
.bar{height:2px;background:#eef0f2}
.bar i{display:block;height:100%;background:var(--accent);transition:width .22s ease}

/* 홈 */
.eyebrow{margin:22px 0 12px;font-size:13px;color:var(--muted);letter-spacing:.01em}
.today{border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin-bottom:28px}
.today-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.today-day{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.today-topic{font-size:14px;color:var(--body);margin-bottom:16px}
.listhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.days{list-style:none;margin:0;padding:0}
.dayrow{width:100%;display:grid;grid-template-columns:1fr auto;gap:1px 8px;align-items:baseline;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.dayrow:active{background:var(--soft)}
.dr-l{display:flex;gap:9px;align-items:baseline}
.dr-l b{font-size:16px;font-weight:600}
.dr-d{font-size:13px;color:var(--muted)}
.dr-s{font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.dr-t{grid-column:1/-1;font-size:13px;color:var(--muted)}
.dayrow.on .dr-l b{color:var(--accent)}
.dayrow.on .dr-l b::after{content:" · 오늘";font-size:12px;font-weight:500;color:var(--muted)}
.foot-note{margin:22px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}

/* 버튼 */
.primary{display:inline-flex;align-items:center;justify-content:center;background:#17181a;color:#fff;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:600;min-height:50px}
.primary:active{background:#000}
.primary:disabled{background:#c9ccd1;color:#fff}
.ghost{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:16px;font-weight:600;min-height:50px;color:var(--body);background:#fff}
.ghost:active{background:var(--soft)}
.wide{display:flex;width:100%}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px 4px}

/* 문제 */
.qmeta{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;font-size:13px;color:var(--muted)}
.qcount{font-variant-numeric:tabular-nums}
.qkind{background:var(--soft);border-radius:5px;padding:3px 8px;font-size:12.5px;color:var(--body)}
.qtext{font-size:18px;line-height:1.78;color:var(--fg);margin:0 0 22px;word-break:keep-all}
.qtext b{font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;line-height:1.6;color:var(--fg);word-break:keep-all;min-height:50px}
.choice:active{background:var(--soft)}
.mk{flex:none;color:#8b9098;font-weight:600;width:17px}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ok .mk{color:var(--ok)}
.choice.no{border-color:var(--no);background:var(--no-bg)}
.choice.no .mk{color:var(--no)}
.choice.dim{opacity:.5}
.choice:disabled{cursor:default}

.ans-row{display:flex;gap:10px;align-items:stretch}
.ans-input{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);min-height:50px}
.ans-input:focus{outline:none;border-color:var(--accent)}
.ans-input:disabled{background:var(--soft);color:var(--body);-webkit-text-fill-color:var(--body);opacity:1}
.ans-input::placeholder{color:#a4a9b0}
.ans-hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.ans-actions{display:flex;align-items:center;gap:6px;margin-top:12px}
.ans-actions .primary{flex:1}

/* 채점 결과 */
.fb{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;scroll-margin-bottom:80px}
.fb-h{font-size:14px;font-weight:700;letter-spacing:.01em}
.fb.ok .fb-h{color:var(--ok)}
.fb.no .fb-h{color:var(--no)}
.fb.neutral .fb-h{color:var(--accent)}
.fb-a{margin:8px 0 10px;font-size:16px}
.fb-a .lbl{color:var(--muted);font-size:13px;margin-right:6px}
.fb-a .ans{font-weight:700}
.fb-a .model{display:block;margin-top:4px;line-height:1.75;font-weight:500;color:var(--fg)}
.fb-x{margin:0 0 14px;font-size:15px;line-height:1.75;color:var(--body);word-break:keep-all}
.judge{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.judge .jbtn{border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:13px;color:var(--body)}
.judge .jbtn.on{border-color:var(--fg);background:var(--fg);color:#fff}
.foot{margin-top:22px}
.foot .note{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0}

/* 결과 */
.result{padding-top:6px}
.big{display:flex;align-items:baseline;gap:4px;margin:8px 0 0}
.big b{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.big span{font-size:18px;color:var(--muted)}
.bigsub{margin:2px 0 22px;font-size:15px;color:var(--body)}
.wrongbox{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px;color:var(--body)}
.wrongbox.none{color:var(--muted)}
.rbtns{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* 규정 카드 */
.sheetwrap{position:fixed;inset:0;background:rgba(20,21,23,.34);z-index:60;display:none}
.sheetwrap.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:88vh;background:#fff;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.sheet-top b{font-size:16px;font-weight:600}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(30px + env(safe-area-inset-bottom))}
.sheet h3{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px;letter-spacing:.02em}
.card{border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px}
.cr{font-size:15px;font-weight:700;margin-bottom:3px}
.cp{font-size:14.5px;color:var(--body);line-height:1.65;word-break:keep-all}
.cl{display:flex;gap:8px;font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.cl i{flex:none;font-style:normal;color:#9aa0a7;font-size:12.5px;padding-top:1px;min-width:22px}
.cl.trap{color:#8a4a41}
.cl.trap i{color:#b23c2f}
.cl span.v{word-break:keep-all}
.sheet ol.checks{margin:0;padding-left:20px}
.sheet ol.checks li{font-size:14.5px;line-height:1.7;color:var(--body);margin-bottom:9px;word-break:keep-all}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheetwrap" id="sheetwrap" aria-hidden="true"></div>

<script>var DATA={"days":[{"day":1,"date":"11/24","weekday":"화","topic":"제1·5·41·57항","level":"쉬움","questions":[{"n":1,"kind":"규정·원칙","q":"다음 중 한글 맞춤법 제1항의 원칙을 옳게 설명한 것은?","explain":"제1항은 “한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.”라고 정하고 있다.","type":"mc","choices":[{"mark":"①","text":"표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다."},{"mark":"②","text":"표준어를 어법에 맞게 적되, 소리 나는 대로만 적음을 원칙으로 한다."},{"mark":"③","text":"표준어를 한자의 본음대로 적음을 원칙으로 한다."},{"mark":"④","text":"형태소와 상관없이 소리대로만 적음을 원칙으로 한다."},{"mark":"⑤","text":"표준어를 된소리로 적되, 의미는 고려하지 않음을 원칙으로 한다."}],"answer":1,"answerMark":"①","display":"①"},{"n":2,"kind":"규정·원칙","q":"한글 맞춤법이 ‘어법에 맞도록’ 적는 것을 원칙으로 하는 까닭으로 가장 적절한 것은?","explain":"소리대로만 적으면 한 형태소가 여러 모습으로 흔들린다. 형태소를 고정해 적어야 뜻을 파악하기 쉽다(제1항의 취지).","type":"mc","choices":[{"mark":"①","text":"발음을 정확하게 하기 위해서이다."},{"mark":"②","text":"뜻을 가진 부분(형태소)을 고정하여 적으면 의미 파악에 효과적이기 때문이다."},{"mark":"③","text":"글자를 적는 속도를 높이기 위해서이다."},{"mark":"④","text":"표준어와 방언을 구별하기 위해서이다."},{"mark":"⑤","text":"외래어를 우리말처럼 적기 위해서이다."}],"answer":2,"answerMark":"②","display":"②"},{"n":3,"kind":"틀린 것","q":"다음 중 맞춤법이 틀린 것은?","explain":"두 모음 사이에서 나는 된소리는 된소리로 적으므로 ‘어깨’가 맞다(제5항 1).","type":"mc","choices":[{"mark":"①","text":"어께"},{"mark":"②","text":"오빠"},{"mark":"③","text":"으뜸"},{"mark":"④","text":"아끼다"},{"mark":"⑤","text":"가끔"}],"answer":1,"answerMark":"①","display":"①"},{"n":4,"kind":"틀린 것","q":"다음 중 맞춤법이 틀린 것은?","explain":"‘ㄱ,ㅂ’ 받침 뒤의 된소리는 같은 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 않으므로 ‘국수’가 맞다(제5항 다만).","type":"mc","choices":[{"mark":"①","text":"국쑤"},{"mark":"②","text":"깍두기"},{"mark":"③","text":"딱지"},{"mark":"④","text":"법석"},{"mark":"⑤","text":"몹시"}],"answer":1,"answerMark":"①","display":"①"},{"n":5,"kind":"고쳐 쓰기","q":"다음 문장의 굵게 표시한 부분을 맞춤법에 맞게 고치시오.\n오늘은 기분이 <b>산듯하다</b>.","explain":"‘ㄴ’ 받침 뒤에서 나는 된소리는 된소리로 적는다(제5항 2). ‘산듯하다’는 잘못이다.","type":"sa","mode":"loose","display":"산뜻하다","answers":["산뜻하다"],"hint":""},{"n":6,"kind":"고쳐 쓰기","q":"다음 문장의 굵게 표시한 부분을 맞춤법에 맞게 고치시오.\n그는 <b>어께</b>를 으쓱이며 대답했다.","explain":"두 모음 ‘ㅓ,ㅐ’ 사이에서 나는 된소리는 된소리로 적는다(제5항 1).","type":"sa","mode":"loose","display":"어깨","answers":["어깨"],"hint":""},{"n":7,"kind":"띄어쓰기","q":"다음 설명이 옳으면 ○, 틀리면 ×를 쓰시오.\n‘꽃이 예쁘다.’에서 ‘이’는 앞말과 띄어 써야 한다.","explain":"조사는 그 앞말에 붙여 쓰므로 ‘꽃이’로 적는다(제41항).","type":"sa","mode":"ox","display":"×","answers":["×","x","X","아니오","아니요","틀림","틀렸다","no"],"hint":"○ 또는 ×"},{"n":8,"kind":"띄어쓰기","q":"다음 문장의 띄어쓰기를 바르게 고치시오.\n저기 까지나 가 보자.","explain":"‘까지’는 조사이므로 앞말에 붙여 쓴다(제41항). ‘어디까지나’, ‘거기도’와 같은 방식이다.","type":"sa","mode":"strict","display":"저기까지나","answers":["저기까지나"],"hint":"띄어쓰기까지 맞춰 쓰세요"},{"n":9,"kind":"혼동 어휘","q":"다음 문장의 빈칸에 들어갈 말을 바르게 짝지은 것은?\n(가) 약속은 ( ) 지켜야 한다.\n(나) 고개를 ( ) 들어라.","explain":"‘반드시’는 ‘틀림없이 꼭’, ‘반듯이’는 ‘기울지 않게 바르게’의 뜻이다. 약속에는 ‘반드시’, 고개를 드는 모양에는 ‘반듯이’를 쓴다(제57항).","type":"mc","choices":[{"mark":"①","text":"반드시 / 반드시"},{"mark":"②","text":"반듯이 / 반듯이"},{"mark":"③","text":"반드시 / 반듯이"},{"mark":"④","text":"반듯이 / 반드시"},{"mark":"⑤","text":"반듯히 / 반드시"}],"answer":3,"answerMark":"③","display":"③"},{"n":10,"kind":"혼동 어휘","q":"다음 중 맞춤법이 틀린 문장은?","explain":"‘저리다’는 감각이 없어지거나 시린 것이고, ‘절이다’는 소금에 담그는 것이다. 다친 다리는 ‘저리다’로 써야 한다(제57항).","type":"mc","choices":[{"mark":"①","text":"다친 다리가 저리다."},{"mark":"②","text":"김장 배추를 절인다."},{"mark":"③","text":"다친 다리를 절인다."},{"mark":"④","text":"배추를 소금에 절였다."},{"mark":"⑤","text":"손이 저려 온다."}],"answer":3,"answerMark":"③","display":"③"}]},{"day":2,"date":"11/25","weekday":"수","topic":"제5·6·42·57항","level":"쉬움","questions":[{"n":1,"kind":"규정·원칙","q":"‘ㄷ,ㅌ’ 받침 뒤에 ‘-이’나 ‘-히’가 붙어 ‘지,치’로 소리 나는 경우, 제6항에 따라 어떻게 적는가?","explain":"‘ㄷ,ㅌ’이 ‘ㅈ,ㅊ’으로 소리 나더라도 ‘ㄷ,ㅌ’으로 적는다(제6항). ‘맏이, 해돋이, 굳이, 같이, 굳히다’가 그 예이다.","type":"mc","choices":[{"mark":"①","text":"소리 나는 대로 ‘지,치’로 적는다."},{"mark":"②","text":"원래의 ‘ㄷ,ㅌ’으로 적는다."},{"mark":"③","text":"뒷말의 첫소리를 된소리로 적는다."},{"mark":"④","text":"‘ㅅ’ 받침으로 적는다."},{"mark":"⑤","text":"단어의 첫머리만 두음법칙을 적용한다."}],"answer":2,"answerMark":"②","display":"②"},{"n":2,"kind":"틀린 것","q":"다음 중 맞춤법이 틀린 것은?","explain":"‘맏이’가 맞다. 소리가 [마지]로 나도 원형 ‘ㄷ’을 밝혀 적는다(제6항).","type":"mc","choices":[{"mark":"①","text":"마지 <script>
(function(){
"use strict";

var KEY = "spellingQuiz.v1";
var SET6 = ["곳간","셋방","숫자","찻간","툇간","횟수"];
var app = document.getElementById("app");
var sheetwrap = document.getElementById("sheetwrap");

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseDay(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayDayNum(){
  var diff = Math.round((parseDay(todayStr()) - parseDay(DATA.startDate)) / 86400000);
  return Math.max(1, Math.min(13, diff + 1));
}
function daysToExam(){
  return Math.round((parseDay(DATA.examDate) - parseDay(todayStr())) / 86400000);
}

/* ── 저장 ─────────────────────────────────────── */
function loadStore(){
  try{
    var s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(s && typeof s === "object" && s.days) return s;
  }catch(e){}
  return {days:{}};
}
var store = loadStore();
function saveStore(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}

/* ── 상태 ─────────────────────────────────────── */
var view = {name:"home"};
var quiz = null;

function dayData(n){ return DATA.days[n-1]; }
function currentQ(){
  var d = dayData(quiz.day), n = quiz.queue[quiz.i];
  for(var i=0;i<d.questions.length;i++) if(d.questions[i].n===n) return d.questions[i];
  return null;
}
function stOf(n){
  if(!quiz.st[n]) quiz.st[n] = {text:"", chosen:null, graded:false, correct:null};
  return quiz.st[n];
}

/* ── 채점 ─────────────────────────────────────── */
function normLoose(s){
  return String(s||"").toLowerCase()
    .replace(/[\s\u00a0]/g,"")
    .replace(/[·.,!?"'`‘’“”()\[\]{}<>《》〈〉…~_\/\\:;→\-–—]/g,"");
}
function normStrict(s){
  return String(s||"").toLowerCase()
    .replace(/[·.,!?"'`‘’“”()\[\]{}<>《》〈〉…~_\/\\:;→\-–—]/g," ")
    .replace(/\s+/g," ").trim();
}
function judge(q, raw){
  var v = String(raw||"");
  if(!v.trim()) return false;
  if(q.mode === "set6"){
    var seen = {}, hit = 0;
    var parts = v.split(/[,·、\/\s]+/);
    for(var i=0;i<parts.length;i++){
      var p = parts[i].trim();
      if(SET6.indexOf(p) >= 0 && !seen[p]){ seen[p]=1; hit++; }
    }
    return hit >= 2;
  }
  var f = q.mode === "strict" ? normStrict : normLoose;
  var target = f(v);
  if(!target) return false;
  for(var j=0;j<q.answers.length;j++){
    if(f(q.answers[j]) === target) return true;
  }
  return false;
}

/* ── 렌더: 홈 ─────────────────────────────────── */
function recordOf(n){ return store.days[String(n)]; }

function topbar(title, opts){
  opts = opts || {};
  var left = opts.home
    ? '<button class="ic" data-act="home" aria-label="홈">&#8592;</button>'
    : '<div class="brand"></div>';
  return '<header class="top"><div class="top-in">'+left+
    '<div class="top-t">'+esc(title)+'</div>'+
    '<button class="ic txt" data-act="sheet">규정 카드</button></div>'+
    (opts.progress != null ? '<div class="bar"><i style="width:'+opts.progress+'%"></i></div>' : '')+
    '</header>';
}

function homeHTML(){
  var today = todayDayNum();
  var dd = daysToExam();
  var done = 0;
  for(var k in store.days) if(store.days[k] && typeof store.days[k].score === "number") done++;

  var head = dd > 0 ? "한글 맞춤법 · 기말 " + dd + "일 전"
           : dd === 0 ? "한글 맞춤법 · 기말 당일"
           : "한글 맞춤법 · 기말 " + (-dd) + "일 지남";
  var now = parseDay(todayStr());
  var todayLabel = now < parseDay(DATA.startDate) ? "시작 전"
                 : now > parseDay("2026-12-06") ? "복습"
                 : "오늘";
  var td = dayData(today);
  var rec = recordOf(today);

  var rows = "";
  DATA.days.forEach(function(d){
    var r = recordOf(d.day);
    rows += '<li><button class="dayrow'+(d.day===today?" on":"")+'" data-act="start" data-day="'+d.day+'">'+
      '<span class="dr-l"><b>Day '+d.day+'</b><span class="dr-d">'+d.date+" "+d.weekday+'</span></span>'+
      '<span class="dr-s">'+(r && typeof r.score==="number" ? r.score+"/10" : "")+'</span>'+
      '<span class="dr-t">'+esc(d.topic)+" · "+esc(d.level)+'</span>'+
      '</button></li>';
  });

  return topbar("맞춤법 10문항") +
    '<main class="wrap home">'+
      '<p class="eyebrow">'+esc(head)+'</p>'+
      '<section class="today">'+
        '<div class="today-top"><span>'+todayLabel+'</span><span>'+td.date+" "+td.weekday+'</span></div>'+
        '<div class="today-day">Day '+td.day+'</div>'+
        '<div class="today-topic">'+esc(td.topic)+" · "+esc(td.level)+'</div>'+
        '<button class="primary wide" data-act="start" data-day="'+td.day+'">'+
          (rec && typeof rec.score==="number" ? "다시 풀기 · "+rec.score+"/10" : "10문항 풀기")+
        '</button>'+
      '</section>'+
      '<div class="listhead"><span>Day 1 – 13</span><span>'+done+'일 완료</span></div>'+
      '<ul class="days">'+rows+'</ul>'+
      '<p class="foot-note">푼 기록과 정답률은 이 기기 브라우저에만 저장됩니다.</p>'+
    '</main>';
}

/* ── 렌더: 문제 ───────────────────────────────── */
function feedbackHTML(q, st){
  if(!st.graded) return "";
  var ok = st.correct === true, bad = st.correct === false;
  var cls = ok ? "ok" : bad ? "no" : "neutral";
  var label = ok ? "정답" : bad ? "오답" : "정답 확인";
  var answer;
  if(q.mode === "narrative"){
    answer = '<div class="fb-a"><span class="lbl">모범 답안</span><span class="ans model">'+esc(q.display)+'</span></div>';
  }else{
    answer = '<div class="fb-a"><span class="lbl">정답</span><span class="ans">'+esc(q.display)+'</span></div>';
  }
  var judgeRow = '<div class="judge"><span>내 답 판정</span>'+
    '<button class="jbtn'+(ok?" on":"")+'" data-act="judge" data-v="1">맞음</button>'+
    '<button class="jbtn'+(bad?" on":"")+'" data-act="judge" data-v="0">틀림</button></div>';
  return '<div class="fb '+cls+'" id="fb">'+
    '<div class="fb-h">'+label+'</div>'+answer+
    (q.explain ? '<p class="fb-x">'+q.explain+'</p>' : "")+
    judgeRow+'</div>';
}

function answerAreaHTML(q, st){
  if(q.type === "mc"){
    var html = '<div class="choices">';
    q.choices.forEach(function(c, i){
      var mark = i+1, cls = "";
      if(st.graded){
        if(mark === q.answer) cls = "ok";
        else if(mark === st.chosen) cls = "no";
        else cls = "dim";
      }
      html += '<button class="choice '+cls+'" data-act="pick" data-i="'+mark+'"'+(st.graded?" disabled":"")+'>'+
        '<span class="mk">'+c.mark+'</span><span>'+c.text+'</span></button>';
    });
    return html+"</div>";
  }
  var isNarr = q.mode === "narrative";
  var input = '<input id="ans" class="ans-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'+
    ' enterkeyhint="done" placeholder="'+(isNarr?"한 문장으로 써 보세요":"답을 입력하세요")+'"'+
    ' value="'+esc(st.text)+'"'+(st.graded?" disabled":"")+'>';
  var actions = st.graded ? "" :
    '<div class="ans-actions"><button class="primary" data-act="grade">확인</button>'+
    '<button class="link" data-act="reveal">정답 보기</button></div>';
  var hint = (!st.graded && q.hint) ? '<p class="ans-hint">'+esc(q.hint)+'</p>' : "";
  var narrNote = (!st.graded && isNarr) ? '<p class="ans-hint">서술형은 모범 답안을 보고 스스로 맞음·틀림을 고를 수 있습니다.</p>' : "";
  return '<div>'+input+hint+narrNote+actions+'</div>';
}

function quizHTML(){
  var d = dayData(quiz.day);
  var q = currentQ();
  var st = stOf(q.n);
  var total = quiz.queue.length;
  var pct = Math.round((quiz.i / total) * 100);
  var last = quiz.i === total - 1;
  var foot = "";
  if(st.graded && st.correct !== null){
    foot = '<div class="foot"><button class="primary wide" data-act="next">'+
      (last ? "결과 보기" : "다음 문제")+'</button></div>';
  }else if(st.graded){
    foot = '<p class="foot note">맞음·틀림을 골라 주세요.</p>';
  }
  return topbar("Day "+d.day+" · "+(quiz.i+1)+"/"+total, {home:true, progress:pct}) +
    '<main class="wrap quiz">'+
      '<div class="qmeta"><span class="qcount">'+(quiz.i+1)+" / "+total+'</span>'+
        '<span class="qkind">'+esc(q.kind)+'</span></div>'+
      '<div class="qtext">'+q.q.split("\n").join("<br>")+'</div>'+
      answerAreaHTML(q, st)+
      feedbackHTML(q, st)+
      foot+
    '</main>';
}

function renderQuiz(keep){
  app.innerHTML = quizHTML();
  var inp = document.getElementById("ans");
  if(inp && !inp.disabled){
    inp.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); grade(); }
    });
  }
  if(keep){
    var fb = document.getElementById("fb");
    if(fb && fb.getBoundingClientRect().top > window.innerHeight - 160){
      fb.scrollIntoView({block:"center", behavior:"smooth"});
    }
  }else{
    window.scrollTo(0,0);
  }
}

/* ── 렌더: 결과 ───────────────────────────────── */
function resultHTML(){
  var d = dayData(quiz.day);
  var last = quiz.last;
  var rec = recordOf(quiz.day) || {score:0, wrong:[]};
  var body;
  if(last.retry){
    body = '<div class="big"><b>'+last.correct+'</b><span>/'+last.queue+'</span></div>'+
      '<p class="bigsub">다시 푼 '+last.queue+'문항 중 '+last.correct+'문항 정답</p>'+
      '<div class="wrongbox'+(last.remaining?"":" none")+'">'+
        (last.remaining ? "남은 오답 <b>"+rec.wrong.join(", ")+"</b>번" : "틀린 문제를 모두 고쳤습니다")+
      '</div>';
  }else{
    var pct = Math.round((last.correct / last.queue) * 100);
    body = '<div class="big"><b>'+pct+'</b><span>%</span></div>'+
      '<p class="bigsub">'+last.queue+'문항 중 '+last.correct+'문항 정답</p>'+
      '<div class="wrongbox'+(rec.wrong.length?" none":"")+'">'+
        (rec.wrong.length ? "틀린 문제 <b>"+rec.wrong.join(", ")+"</b>번" : "틀린 문제가 없습니다")+
      '</div>';
  }
  var btns = "";
  if(rec.wrong && rec.wrong.length){
    btns += '<button class="primary wide" data-act="retry">틀린 문제만 다시 풀기</button>';
  }
  btns += '<button class="ghost wide" data-act="home">홈으로</button>';

  return topbar("Day "+d.day+" · 결과", {home:true}) +
    '<main class="wrap result">'+
      '<p class="eyebrow">Day '+d.day+" · "+d.date+" "+d.weekday+'</p>'+
      body+
      '<div class="rbtns">'+btns+'</div>'+
      '<p class="foot-note">헷갈린 규정은 위 ‘규정 카드’에서 바로 확인할 수 있습니다.</p>'+
    '</main>';
}

/* ── 화면 전환 ───────────────────────────────── */
function render(){
  if(view.name === "quiz"){ renderQuiz(false); return; }
  if(view.name === "result"){ app.innerHTML = resultHTML(); window.scrollTo(0,0); return; }
  app.innerHTML = homeHTML(); window.scrollTo(0,0);
}

function startDay(dayNum, onlyWrong){
  var d = dayData(dayNum);
  var rec = recordOf(dayNum);
  var queue = onlyWrong && rec && rec.wrong && rec.wrong.length
    ? rec.wrong.slice()
    : d.questions.map(function(q){ return q.n; });
  quiz = {day:dayNum, queue:queue, i:0, retry:!!onlyWrong, st:{}, last:null};
  view = {name:"quiz"};
  render();
}

function pick(mark){
  var q = currentQ(), st = stOf(q.n);
  if(st.graded) return;
  st.chosen = mark;
  st.graded = true;
  st.correct = (mark === q.answer);
  renderQuiz(true);
}

function grade(){
  var q = currentQ(), st = stOf(q.n);
  if(st.graded) return;
  var inp = document.getElementById("ans");
  var v = inp ? inp.value : st.text;
  if(!String(v).trim()){ if(inp) inp.focus(); return; }
  st.text = v;
  st.graded = true;
  st.correct = q.mode === "narrative" ? null : judge(q, v);
  renderQuiz(true);
}

function reveal(){
  var q = currentQ(), st = stOf(q.n);
  var inp = document.getElementById("ans");
  st.text = inp ? inp.value : st.text;
  st.graded = true;
  st.correct = null;
  renderQuiz(true);
}

function judgeSelf(v){
  var q = currentQ(), st = stOf(q.n);
  st.correct = (v === "1");
  renderQuiz(false);
  window.scrollTo(0, Math.max(0, document.getElementById("fb").offsetTop - 260));
}

function next(){
  var st = stOf(currentQ().n);
  if(!st.graded || st.correct === null) return;
  if(quiz.i < quiz.queue.length - 1){
    quiz.i++;
    renderQuiz(false);
  }else{
    finish();
  }
}

function finish(){
  var d = dayData(quiz.day);
  var wrong = [], correct = 0;
  quiz.queue.forEach(function(n){
    var st = quiz.st[n];
    if(st && st.correct === true) correct++;
    else wrong.push(n);
  });
  var prev = store.days[String(d.day)] || {};
  if(quiz.retry){
    var remaining = (prev.wrong || []).filter(function(n){ return wrong.indexOf(n) >= 0; });
    store.days[String(d.day)] = {score:10 - remaining.length, wrong:remaining, attempts:(prev.attempts||0)+1, ts:Date.now()};
    quiz.last = {retry:true, queue:quiz.queue.length, correct:correct, remaining:remaining.length};
  }else{
    store.days[String(d.day)] = {score:correct, wrong:wrong.slice(), attempts:(prev.attempts||0)+1, ts:Date.now()};
    quiz.last = {retry:false, queue:quiz.queue.length, correct:correct, remaining:wrong.length};
  }
  saveStore();
  view = {name:"result"};
  render();
}

function goHome(){
  var answered = quiz && Object.keys(quiz.st).some(function(k){ return quiz.st[k].graded; });
  if(view.name === "quiz" && answered && !window.confirm("지금까지 푼 답은 저장되지 않습니다. 그만 풀까요?")) return;
  view = {name:"home"}; quiz = null; render();
}

/* ── 규정 카드 ───────────────────────────────── */
function sheetHTML(){
  var html = '<div class="sheet" role="dialog" aria-label="규정 암기 카드">'+
    '<div class="sheet-top"><b>규정 암기 카드</b><button class="link" data-act="closeSheet">닫기</button></div>'+
    '<div class="sheet-body">';
  DATA.sheet.forEach(function(sec){
    html += "<h3>"+esc(sec.title)+"</h3>";
    if(sec.rows && sec.rows.length){
      sec.rows.forEach(function(r){
        html += '<div class="card">'+
          (r.rule ? '<div class="cr">'+esc(r.rule)+'</div>' : "")+
          '<div class="cp">'+esc(r.point)+'</div>'+
          (r.ex ? '<div class="cl"><i>예</i><span class="v">'+esc(r.ex)+'</span></div>' : "")+
          (r.trap ? '<div class="cl trap"><i>함정</i><span class="v">'+esc(r.trap)+'</span></div>' : "")+
        '</div>';
      });
    }
    if(sec.items && sec.items.length){
      html += '<ol class="checks">';
      sec.items.forEach(function(it){ html += "<li>"+esc(it)+"</li>"; });
      html += "</ol>";
    }
  });
  return html + "</div></div>";
}

function openSheet(){
  sheetwrap.classList.add("open");
  sheetwrap.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  sheetwrap.classList.remove("open");
  sheetwrap.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}

/* ── 이벤트 ──────────────────────────────────── */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");
  if(act === "start"){ startDay(+el.getAttribute("data-day"), false); }
  else if(act === "pick"){ pick(+el.getAttribute("data-i")); }
  else if(act === "grade"){ grade(); }
  else if(act === "reveal"){ reveal(); }
  else if(act === "judge"){ judgeSelf(el.getAttribute("data-v")); }
  else if(act === "next"){ next(); }
  else if(act === "retry"){ startDay(quiz.day, true); }
  else if(act === "home"){ goHome(); }
  else if(act === "sheet"){ openSheet(); }
  else if(act === "closeSheet"){ closeSheet(); }
});
sheetwrap.addEventListener("click", function(e){
  if(e.target === sheetwrap) closeSheet();
});

sheetwrap.innerHTML = sheetHTML();
render();

/* 테스트용 훅(화면에는 노출되지 않음) */
window.__quiz = {
  state: function(){ return {view:view.name, quiz:quiz, store:store}; },
  start: startDay
};
})();
</script>
</body>
